version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: phuai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: phuai
    volumes:
      - mongodb_data:/data/db
    networks:
      - phuai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phuai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/phuai
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - phuai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost/api}
        REACT_APP_STRIPE_PUBLISHABLE_KEY: ${REACT_APP_STRIPE_PUBLISHABLE_KEY}
        REACT_APP_WEB3_CONTRACT_ADDRESS: ${REACT_APP_WEB3_CONTRACT_ADDRESS}
    container_name: phuai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - phuai-network

  nginx:
    image: nginx:1.27-alpine
    container_name: phuai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - phuai-network

volumes:
  mongodb_data:
    name: phuai_mongodb_data

networks:
  phuai-network:
    name: phuai-network
    driver: bridge
